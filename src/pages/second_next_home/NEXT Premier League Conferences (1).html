<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXT Premier League Conferences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@property --tw{syntax:'<angle>';inherits:true;initial-value:7deg}
:root{
  --paper:#FFFFFF;--ink:#03050A;--blue:#1F3BFF;--radiant:#2F7BFF;--cyan:#2EE6FF;
  --u:min(1vw,14.5px);
  --display:'Bricolage Grotesque','Arial Narrow',Impact,sans-serif;
  --text:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text)}
a:focus-visible,button:focus-visible{outline:3px solid var(--radiant);outline-offset:4px;border-radius:4px}

.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;padding:0 max(20px,4vw);overflow:clip;isolation:isolate}
.hero>*{width:100%;max-width:1480px;margin-inline:auto}

/* background: soft colour mesh + fine grid that fades out */
.bg{position:absolute;inset:0;z-index:-2;max-width:none;pointer-events:none;overflow:hidden}
.bg::before{content:"";position:absolute;inset:-20%;
  background:
    radial-gradient(38% 42% at 82% 28%,rgba(46,230,255,.38),transparent 70%),
    radial-gradient(40% 45% at 68% 78%,rgba(31,59,255,.20),transparent 70%),
    radial-gradient(34% 40% at 6% 100%,rgba(47,123,255,.14),transparent 70%);
  animation:drift 22s ease-in-out infinite alternate}
.bg::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(3,5,10,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(3,5,10,.055) 1px,transparent 1px);
  background-size:calc(var(--u)*4.2) calc(var(--u)*4.2);
  -webkit-mask:radial-gradient(70% 70% at 75% 45%,#000,transparent 85%);mask:radial-gradient(70% 70% at 75% 45%,#000,transparent 85%)}
@keyframes drift{to{transform:translate3d(-4%,3%,0) scale(1.06)}}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;font:700 15px/1.1 var(--display)}
.brand svg{width:40px;height:40px;display:block}
.links{display:flex;gap:clamp(18px,2.6vw,40px);list-style:none;margin:0;padding:0}
.links a{color:inherit;text-decoration:none;font-size:15px;font-weight:500;position:relative;padding:6px 0}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan));transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.links a:hover::after,.links a[aria-current]::after{transform:scaleX(1)}
.menu-btn{display:none;font:600 15px var(--text);background:#fff;border:1.5px solid var(--ink);color:var(--ink);border-radius:99px;padding:10px 18px;min-height:44px;cursor:pointer}

/* layout */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);align-items:center;gap:calc(var(--u)*2);padding-bottom:28px}
.copy{position:relative;z-index:2}

.title{margin:0;font-family:var(--display);font-weight:800;font-stretch:90%;text-transform:uppercase;letter-spacing:-.045em;line-height:.8}
.m{display:block;overflow:hidden;padding:.07em .04em .05em;margin:-.07em -.04em -.05em}
.m>span{display:block;transform:translateY(108%);animation:rise 1.1s var(--d,0s) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{transform:none}}
.l1{font-size:calc(var(--u)*21);--d:.1s}
.l1>span{background:linear-gradient(100deg,var(--ink) 0%,var(--ink) 30%,var(--blue) 66%,var(--cyan) 100%);
  background-size:220% 100%;background-position:var(--gx,40%) 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.l2{font-size:calc(var(--u)*2.6);--d:.45s;font-weight:600;letter-spacing:-.01em;line-height:1;margin:calc(var(--u)*2.2) 0 calc(var(--u)*1.4)}
.l2>span{display:flex;align-items:center;gap:calc(var(--u)*1.2)}
.l2>span::after{content:"";flex:1;max-width:calc(var(--u)*14);height:2px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.l3{font-size:calc(var(--u)*8.2);--d:.3s}

.foot{margin-top:calc(var(--u)*3.2);display:grid;gap:26px;justify-items:start}
.foot p{margin:0;max-width:34ch;font-size:clamp(17px,1.3vw,21px);line-height:1.45;font-weight:500;opacity:0;animation:fade .9s 1s ease forwards}
@keyframes fade{to{opacity:1}}
.ctas{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:fade .9s 1.15s ease forwards}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 30px;border-radius:99px;
  font:600 16px var(--text);text-decoration:none;color:#fff;background:var(--ink);isolation:isolate;transition:color .3s,box-shadow .4s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,var(--blue),var(--radiant) 55%,var(--cyan));transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.btn:hover::before,.btn:focus-visible::before{transform:none}
.btn:hover{box-shadow:0 10px 30px -8px rgba(31,59,255,.6)}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{color:#fff;box-shadow:inset 0 0 0 1.5px transparent}

/* artwork: a tunnel of twisting frames */
.art{position:relative;width:100%;max-width:calc(var(--u)*44);aspect-ratio:1;justify-self:end;perspective:900px;z-index:1}
.tilt{width:100%;height:100%;transform:rotateX(calc(var(--py,0)*-7deg)) rotateY(calc(var(--px,0)*9deg)) rotate(calc(var(--px,0)*6deg));will-change:transform}
.art svg{width:100%;height:100%;overflow:visible;display:block;animation:intro 1.8s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes intro{from{opacity:0;transform:scale(.55) rotate(-40deg)}}
.art rect{transform-box:view-box;transform-origin:50% 50%;transform:rotate(calc(var(--i)*var(--tw)))}
.art svg{animation-name:intro,twist;animation-duration:1.8s,14s;animation-delay:.2s,.2s;animation-timing-function:cubic-bezier(.2,.8,.2,1),ease-in-out;
  animation-iteration-count:1,infinite;animation-direction:normal,alternate;animation-fill-mode:both,none}
@keyframes twist{from{--tw:3deg}to{--tw:11deg}}
.art::before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(46,230,255,.55),rgba(31,59,255,.18) 55%,transparent 72%);filter:blur(24px);z-index:-1}

/* mobile: headline first, artwork becomes a faded backdrop behind it */
@media (max-width:820px){
  :root{--u:1vw}
  .menu-btn{display:inline-flex;align-items:center}
  .links{position:fixed;inset:0;z-index:30;background:var(--ink);flex-direction:column;justify-content:center;gap:6px;padding:0 28px;
    clip-path:circle(0 at calc(100% - 50px) 40px);transition:clip-path .6s cubic-bezier(.2,.8,.2,1);visibility:hidden}
  .links.open{clip-path:circle(150% at calc(100% - 50px) 40px);visibility:visible}
  .links a{color:#fff;font:700 clamp(34px,11vw,52px)/1.15 var(--display);letter-spacing:-.03em;display:block;padding:6px 0}
  .menu-btn{position:relative;z-index:40}
  .menu-btn[aria-expanded="true"]{background:#fff;border-color:#fff}
  .main{grid-template-columns:1fr;align-content:start;padding-top:4vh}
  .art{position:absolute;right:-34vw;top:2vh;width:104vw;max-width:none;opacity:.5}
  .l1{font-size:calc(var(--u)*34)}
  .l2{font-size:calc(var(--u)*5.2);margin:calc(var(--u)*3.5) 0 calc(var(--u)*2.5)}
  .l2>span::after{max-width:calc(var(--u)*24)}
  .l3{font-size:calc(var(--u)*12.4)}
  .foot{margin-top:calc(var(--u)*8)}
  .ctas{width:100%}.ctas .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){
  .m>span{transform:none;animation:none}.art svg,.bg::before{animation:none}.foot p,.ctas{opacity:1;animation:none}
  .btn::before,.links,.links a::after{transition:none}
}
</style>
</head>
<body>
<header class="hero" id="hero">
  <div class="bg" aria-hidden="true"></div>

  <nav class="nav" aria-label="Main">
    <a class="brand" href="#" aria-label="NEXT Premier League Conferences, home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1F3BFF"/><stop offset="1" stop-color="#2EE6FF"/></linearGradient></defs>
        <rect width="40" height="40" rx="11" fill="#03050A"/><path d="M12 29V11h3.4l9.2 11.6V11H28v18h-3.4L15.4 17.4V29z" fill="#fff"/><circle cx="29.5" cy="30" r="2.4" fill="url(#lg)"/></svg>
      <span>NEXT</span>
    </a>
    <button class="menu-btn" aria-expanded="false" aria-controls="links">Menu</button>
    <ul class="links" id="links">
      <li><a href="#" aria-current="page">Home</a></li>
      <li><a href="#">Conferences</a></li>
      <li><a href="#">Speakers</a></li>
      <li><a href="#">Gallery</a></li>
      <li><a href="#">About Us</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="main">
    <div class="copy">
      <h1 class="title">
        <span class="m l1"><span>Next</span></span>
        <span class="m l2"><span>Premier League</span></span>
        <span class="m l3"><span>Conferences</span></span>
      </h1>
      <div class="foot">
        <p>World-class conferences bringing together visionaries, industry leaders and changemakers.</p>
        <div class="ctas">
          <a class="btn" href="#">Explore Conferences</a>
          <a class="btn ghost" href="#">Become a Speaker</a>
        </div>
      </div>
    </div>

    <div class="art" id="art" aria-hidden="true">
      <div class="tilt" id="tilt">
        <svg viewBox="0 0 400 400" id="frames" focusable="false">
          <defs><radialGradient id="core" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#2EE6FF"/><stop offset="1" stop-color="#1F3BFF"/></radialGradient></defs>
        </svg>
      </div>
    </div>
  </div>
</header>

<script>
(function(){
  /* build the frame tunnel: 18 rounded squares, colour runs black -> blue -> cyan */
  var svg=document.getElementById('frames'),N=18,ns='http://www.w3.org/2000/svg';
  function mix(a,b,t){return a.map(function(v,i){return Math.round(v+(b[i]-v)*t)})}
  var ink=[3,5,10],blue=[31,59,255],cyan=[46,230,255];
  for(var i=0;i<N;i++){
    var t=i/(N-1),c=t<.55?mix(ink,blue,t/.55):mix(blue,cyan,(t-.55)/.45),s=372-i*19.5,r=document.createElementNS(ns,'rect');
    r.setAttribute('x',200-s/2);r.setAttribute('y',200-s/2);r.setAttribute('width',s);r.setAttribute('height',s);r.setAttribute('rx',s*.13);
    r.setAttribute('fill',i%3===2?'rgba(47,123,255,.06)':'none');
    r.setAttribute('stroke','rgb('+c.join(',')+')');r.setAttribute('stroke-width',i<4?2.4:1.8);
    r.style.setProperty('--i',i);svg.appendChild(r);
  }
  var core=document.createElementNS(ns,'rect');
  core.setAttribute('x',176);core.setAttribute('y',176);core.setAttribute('width',48);core.setAttribute('height',48);core.setAttribute('rx',12);core.setAttribute('fill','url(#core)');
  core.style.setProperty('--i',N);svg.appendChild(core);

  var btn=document.querySelector('.menu-btn'),links=document.getElementById('links');
  btn.addEventListener('click',function(){
    var open=links.classList.toggle('open');
    btn.setAttribute('aria-expanded',open);btn.textContent=open?'Close':'Menu';
    document.body.style.overflow=open?'hidden':'';
  });
  links.addEventListener('click',function(e){if(e.target.tagName==='A'&&links.classList.contains('open'))btn.click()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&links.classList.contains('open'))btn.click()});

  /* desktop: the artwork leans toward the cursor, headline gradient follows */
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var hero=document.getElementById('hero'),tilt=document.getElementById('tilt'),copy=hero.querySelector('.copy');
  var tx=0,ty=0,x=0,y=0,raf=0;
  function tick(){
    x+=(tx-x)*.07;y+=(ty-y)*.07;
    tilt.style.setProperty('--px',x.toFixed(3));tilt.style.setProperty('--py',y.toFixed(3));
    copy.style.setProperty('--gx',(40+x*40).toFixed(1)+'%');
    raf=(Math.abs(tx-x)+Math.abs(ty-y)>.002)?requestAnimationFrame(tick):0;
  }
  hero.addEventListener('pointermove',function(e){
    var r=hero.getBoundingClientRect();
    tx=(e.clientX-r.left)/r.width*2-1;ty=(e.clientY-r.top)/r.height*2-1;
    if(!raf)raf=requestAnimationFrame(tick);
  },{passive:true});
})();
</script>
</body>
</html>
